# ──────────────────────────────────────────────────────────────────
# LifeDrop Backend — Production Configuration Profile (prod)
# All sensitive secrets and cloud endpoints read from environment variables.
# ──────────────────────────────────────────────────────────────────

# ─── Server ───
server.port=${PORT:8080}

# ─── PostgreSQL Database (Neon / Supabase / Render PostgreSQL) ───
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ─── JWT Authentication ───
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ─── Production CORS (Restricted to Real Domain) ───
# Example: https://lifedrop.vercel.app,https://lifedrop.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://lifedrop.vercel.app,https://lifedrop.onrender.com}

# ─── Push Notifications & Clinical Rules ───
donation.gap-days=${DONATION_GAP_DAYS:90}
expo.push.url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}

# ─── OpenAPI / Swagger ───
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ─── Passwordless Email OTP ───
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-hour=5
app.otp.mail-enabled=${OTP_MAIL_ENABLED:true}
app.otp.pepper=${OTP_PEPPER:change-me-in-production-pepper}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@lifedrop.app}
