# ─── Server ───
server.port=8080
context.initializer.classes=com.lifedrop.config.DatabaseUrlEnvironmentInitializer

# ─── Database ───
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lifedrop}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ───
app.jwt.secret=${JWT_SECRET:LifeDropDefaultDevSecret_ChangeMe_In_Production_1234567890abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ─── Swagger / OpenAPI ───
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Business Rules ───
donation.gap-days=${DONATION_GAP_DAYS:90}

# ─── Passwordless Email OTP ───
app.otp.length=6
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-hour=5
app.otp.mail-enabled=${OTP_MAIL_ENABLED:true}
app.otp.pepper=${OTP_PEPPER:dev-only-otp-pepper-change-me}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@lifedrop.app}
