# ──────────────────────────────────────────────────────────────────
# Render Blueprint Specification for LifeDrop Backend
# Allows 1-click or automated deployment on Render (render.com)
# ──────────────────────────────────────────────────────────────────
services:
  - type: web
    name: lifedrop-backend
    runtime: docker
    rootDir: lifedrop/backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: https://lifedrop.vercel.app,https://lifedrop.onrender.com
      - key: DONATION_GAP_DAYS
        value: 90
